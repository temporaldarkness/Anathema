server {
    listen 8011;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health-check
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA под префиксом
    location /games/aspects/ {
        try_files $uri $uri/ /games/aspects/index.html;
    }

    # Долгий кеш для хешированных ассетов
    location ~* ^/games/aspects/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}